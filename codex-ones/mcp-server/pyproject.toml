[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "university-insights-mcp"
version = "0.1.0"
description = "Read-only MCP server over synthetic university insights data"
requires-python = ">=3.10"
dependencies = [
  "codex-ones==0.1.0",
  "mcp[cli]==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
university-insights-mcp = "university_insights_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
codex-ones = { path = ".." }
