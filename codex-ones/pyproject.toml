[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-ones"
version = "0.1.0"
description = "Evidence-first, human-accountable agent engineering lessons"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
learn = [
  "openai==2.53.0",
  "openai-agents==0.19.4",
  "python-dotenv>=1.0,<2",
]
dev = [
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_ones = ["sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
